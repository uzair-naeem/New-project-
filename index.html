<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./app.js"></script>
</head>
<body>
    <div class="container">
        <div class="budget-expenses">
            <div class="budget">
                <label for="budget-input">Budget</label>
                <input type="number" id="budget-input" placeholder="Enter Total Amount">
                <button id="set-budget">Set Budget</button>
            </div>
            <div class="expenses">
                <label for="expense-input">Expenses</label>
                <input type="text" id="expense-input" placeholder="Movies">
                <input type="number" id="amount-input" placeholder="250">
                <button id="check-amount">Check Amount</button>
            </div>
        </div>
        
        <div class="summary">
            <div class="total-budget">
                <span>Total Budget</span>
                <p id="total-budget">8000</p>
            </div>
            <div class="expenses-total">
                <span>Expenses</span>
                <p id="expenses-total">6500</p>
            </div>
            <div class="balance">
                <span>Balance</span>
                <p id="balance">1500</p>
            </div>
        </div>

        <div class="expense-list">
            <h3>Expense List</h3>
            <ul>
                <li>Groceries: 2200 <button class="edit">✏️</button> <button class="delete">❌</button></li>
                <li>Rent: 3500 <button class="edit">✏️</button> <button class="delete">❌</button></li>
                <li>Transport: 800 <button class="edit">✏️</button> <button class="delete">❌</button></li>
            </ul>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
